<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A premium bundle of 9 classic mind and board games with a sleek neon-glassmorphic UI. Features local play, LAN multiplayer, and online multiplayer.">
  <meta name="keywords" content="mind games, board games, multi-player, local multiplayer, online games, glassmorphism, sudoku, checkers, connect four, minesweeper, 2048, word search, sliding puzzle">
  <meta name="theme-color" content="#0d0e15">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Lazy Games — Neon Mind & Board Games">
  <meta property="og:description" content="A premium bundle of 9 classic mind and board games with a sleek neon-glassmorphic UI. Features local play, LAN multiplayer, and online multiplayer.">
  <meta property="og:image" content="apple-touch-icon.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Lazy Games — Neon Mind & Board Games">
  <meta name="twitter:description" content="A premium bundle of 9 classic mind and board games with a sleek neon-glassmorphic UI. Features local play, LAN multiplayer, and online multiplayer.">
  <meta name="twitter:image" content="apple-touch-icon.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lazy Games">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicons and app icon -->
  <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="shortcut icon" href="favicon.ico" />

  <title>Lazy Games — Neon Mind & Board Games</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js" type="application/javascript"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
